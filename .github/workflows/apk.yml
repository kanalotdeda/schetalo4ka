name: Build Grow Dragon APK
on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Signing key (from repository secret)
        env:
          KEY_B64: ${{ secrets.ANDROID_KEY_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "Нет секрета ANDROID_KEY_B64"; exit 1; fi
          echo "$KEY_B64" | tr -d ' \r\n' | base64 -d > key.jks
          keytool -list -keystore key.jks -storepass growdragon >/dev/null
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/ru/semya/growdragon app/src/main/assets app/src/main/res/drawable app/src/main/res/values
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GrowDragon"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'ru.semya.growdragon'
            compileSdk 34
            defaultConfig {
              applicationId 'ru.semya.growdragon'
              minSdk 24
              targetSdk 34
              versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
              versionName '2.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
            }
            signingConfigs { release { storeFile file('../key.jks'); storePassword 'growdragon'; keyAlias 'gd'; keyPassword 'growdragon' } }
            buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Grow Dragon" android:icon="@drawable/ic_launcher" android:allowBackup="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#A78BFA" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFF3D9" android:pathData="M54,18C74,18 84,50 84,66C84,84 71,94 54,94C37,94 24,84 24,66C24,50 34,18 54,18Z"/>
            <path android:fillColor="#FFB8D9" android:pathData="M42,42m-6,0a6,6 0,1 1,12 0a6,6 0,1 1,-12 0"/>
            <path android:fillColor="#5CCFA6" android:pathData="M66,38m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0"/>
            <path android:fillColor="#C7B8FF" android:pathData="M70,66m-7,0a7,7 0,1 1,14 0a7,7 0,1 1,-14 0"/>
            <path android:fillColor="#5CCFA6" android:pathData="M40,76m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0"/>
          </vector>
          EOF
          cat > app/src/main/java/ru/semya/growdragon/MainActivity.java <<'EOF'
          package ru.semya.growdragon;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends Activity {
            private WebView web;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setSupportZoom(false);
              web.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  return loader.shouldInterceptRequest(r.getUrl());
                }
              });
              setContentView(web);
              web.setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN);
              if (b != null) web.restoreState(b); else web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
            @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
            @Override public void onBackPressed() {
              web.evaluateJavascript("(function(){var b=document.querySelector('.screen.active [id$=BackBtn]');if(b){b.click();return 1}return 0})()",
                r -> { if (!"1".equals(r)) MainActivity.super.onBackPressed(); });
            }
          }
          EOF
      - name: Build APK
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk GrowDragon.apk
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Grow Dragon (последняя версия)
          body: Готовый APK игры. Собирается автоматически при каждом изменении index.html.
          files: GrowDragon.apk
          make_latest: true
