<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b8def">
<title>Считалочка</title>
<style>
  :root {
    --bg:#f5f7ff; --card:#ffffff; --primary:#5b8def; --primary-dark:#4a75d0;
    --green:#4ecb71; --red:#ff6b6b; --text:#2a2f45; --text-dim:#8a90a8;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #app {
    height:100dvh; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* --- Шапка --- */
  header {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 20px; font-weight:600;
  }
  .level-info { display:flex; align-items:center; gap:10px; }
  .level-badge {
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:11px;
    background:var(--primary); color:#fff; font-size:16px;
    box-shadow:0 4px 10px rgba(91,141,239,.3);
  }
  .level-name { color:var(--text-dim); font-size:15px; }
  .score { font-size:18px; color:var(--primary); }

  /* --- Полоса прогресса --- */
  .progress-bar {
    height:6px; background:#e0e5f5; margin:0 20px;
    border-radius:3px; overflow:hidden;
  }
  .progress-fill {
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,#5b8def,#7ba6ff);
    transition:width .35s ease;
  }

  /* --- Основное --- */
  main {
    flex:1; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    padding:20px; gap:clamp(20px,4vh,50px);
  }
  .problem-card {
    background:var(--card); border-radius:30px;
    padding:clamp(20px,4vh,44px) clamp(30px,7vw,70px);
    box-shadow:0 12px 40px rgba(91,141,239,.12);
  }
  .problem {
    font-size:clamp(48px,11vw,100px);
    font-weight:800; letter-spacing:2px;
    color:var(--text); white-space:nowrap;
  }

  .answers {
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:clamp(12px,2vw,22px);
    width:100%; max-width:720px;
  }
  .answer-btn {
    height:clamp(90px,18vh,170px);
    border:none; background:var(--card); border-radius:24px;
    font-family:inherit; font-weight:800;
    font-size:clamp(30px,6vw,52px);
    color:var(--primary); cursor:pointer;
    box-shadow:0 6px 20px rgba(91,141,239,.16);
    transition:transform .12s, box-shadow .12s, background .2s, color .2s;
    display:flex; align-items:center; justify-content:center;
  }
  .answer-btn:active { transform:scale(.96); }
  .answer-btn.correct {
    background:var(--green); color:#fff;
    box-shadow:0 6px 24px rgba(78,203,113,.5);
    animation:pop .4s;
  }
  .answer-btn.wrong {
    background:var(--red); color:#fff;
    box-shadow:0 6px 24px rgba(255,107,107,.5);
    animation:shake .4s;
  }
  .answer-btn:disabled { pointer-events:none; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    75%{transform:translateX(8px)}
  }

  /* --- Тост с похвалой --- */
  .toast {
    position:fixed; left:50%; bottom:40px;
    transform:translateX(-50%) translateY(20px);
    background:var(--green); color:#fff;
    padding:14px 30px; border-radius:999px;
    font-size:22px; font-weight:800;
    opacity:0; pointer-events:none; z-index:100;
    box-shadow:0 10px 28px rgba(78,203,113,.4);
    transition:opacity .25s, transform .25s;
    white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.warn {
    background:var(--red);
    box-shadow:0 10px 28px rgba(255,107,107,.4);
  }

  /* --- Оценка в конце раунда --- */
  .overlay {
    position:fixed; inset:0;
    background:rgba(42,47,69,.55);
    backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center;
    z-index:200; padding:20px;
  }
  .overlay.show { display:flex; }
  .overlay-card {
    background:#fff; border-radius:32px;
    padding:36px 32px; text-align:center;
    max-width:420px; width:100%;
    box-shadow:0 20px 60px rgba(42,47,69,.3);
    animation:pop .4s;
  }
  .grade {
    font-size:110px; font-weight:900; line-height:1;
    background:linear-gradient(135deg,#5b8def,#7ba6ff);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
  }
  .grade-text { font-size:26px; font-weight:800; margin-top:8px; }
  .stats { color:var(--text-dim); margin-top:10px; font-size:17px; }
  .btn {
    margin-top:26px; width:100%;
    background:var(--primary); color:#fff;
    border:none; padding:18px;
    border-radius:18px; font-family:inherit;
    font-size:19px; font-weight:800;
    cursor:pointer; transition:transform .12s, background .15s;
  }
  .btn:active { transform:scale(.97); background:var(--primary-dark); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="level-info">
      <span class="level-badge" id="levelBadge">1</span>
      <span class="level-name" id="levelName">Сложение до 10</span>
    </div>
    <div class="score" id="score">⭐ 0</div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <main>
    <div class="problem-card">
      <div class="problem" id="problemText">5 + 7</div>
    </div>
    <div class="answers" id="answers"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="grade" id="gradeEmoji">5</div>
    <div class="grade-text" id="gradeText">Отлично!</div>
    <div class="stats" id="statsText">10 из 10</div>
    <button class="btn" id="continueBtn">Продолжить</button>
  </div>
</div>

<script>
/* ============ Утилиты ============ */
const $ = id => document.getElementById(id);
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* ============ Звук ============ */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type = 'sine', when = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}
const sndCorrect = () => { beep(660, 0.12); beep(990, 0.18, 'sine', 0.09); };
const sndWrong   = () => { beep(300, 0.14, 'triangle'); beep(200, 0.24, 'triangle', 0.12); };

/* ============ Генераторы примеров ============ */
// сложение до 10
function genAdd10() {
  const a = rand(2, 8);
  const b = rand(1, 10 - a);
  return { a, b, op: '+', answer: a + b };
}
// сложение до 20 без перехода через десяток (10+5, 12+3, 11+8...)
function genAdd20NoCarry() {
  let a, b;
  while (true) {
    a = rand(2, 15);
    b = rand(2, 15);
    const s = a + b;
    if (s < 11 || s > 20) continue;
    if ((a % 10) + (b % 10) >= 10) continue;
    break;
  }
  return { a, b, op: '+', answer: a + b };
}
// сложение с переходом (5+7, 8+6, 9+6...)
function genAdd20Carry() {
  let a, b;
  while (true) {
    a = rand(2, 9);
    b = rand(2, 9);
    const s = a + b;
    if (s < 11 || s > 18) continue;
    break;
  }
  return { a, b, op: '+', answer: a + b };
}
// вычитание до 10
function genSub10() {
  const a = rand(3, 10);
  const b = rand(1, a - 1);
  return { a, b, op: '−', answer: a - b };
}
// вычитание до 20
function genSub20() {
  let a, b;
  while (true) {
    a = rand(11, 20);
    b = rand(2, 9);
    if (a - b < 1 || a - b > 15) continue;
    break;
  }
  return { a, b, op: '−', answer: a - b };
}
// микс
function genMix() {
  const gens = [genAdd10, genAdd20NoCarry, genAdd20Carry, genSub10, genSub20];
  return gens[rand(0, gens.length - 1)]();
}

/* ============ Уровни ============ */
const LEVELS = [
  { name: 'Сложение до 10',      gen: genAdd10 },
  { name: 'Сложение до 20',      gen: genAdd20NoCarry },
  { name: 'Переход через 10',    gen: genAdd20Carry },
  { name: 'Вычитание до 10',     gen: genSub10 },
  { name: 'Вычитание до 20',     gen: genSub20 },
  { name: 'Всё вместе',          gen: genMix },
];

const ROUND_SIZE = 10;   // примеров в раунде
const PASS = 8;          // сколько нужно решить, чтобы пройти уровень

/* ============ Состояние ============ */
const state = {
  level: 0,
  score: 0,
  questionInRound: 0,
  correctInRound: 0,
  current: null,
  locked: false,
};

function saveProgress() {
  try {
    localStorage.setItem('schetalo4ka', JSON.stringify({
      level: state.level, score: state.score
    }));
  } catch (e) {}
}
function loadProgress() {
  try {
    const s = JSON.parse(localStorage.getItem('schetalo4ka') || '{}');
    if (typeof s.level === 'number') state.level = Math.max(0, Math.min(LEVELS.length - 1, s.level));
    if (typeof s.score === 'number') state.score = s.score;
  } catch (e) {}
}

/* ============ Варианты ответа ============ */
function makeOptions(answer) {
  const set = new Set([answer]);
  // сначала близкие, потом подальше
  const pool = shuffle([
    answer - 1, answer + 1, answer - 2, answer + 2,
    answer - 3, answer + 3, answer + 10, answer - 10,
  ]);
  for (const v of pool) {
    if (set.size >= 3) break;
    if (v > 0 && v !== answer) set.add(v);
  }
  return shuffle(Array.from(set));
}

/* ============ Отрисовка ============ */
function render() {
  $('levelBadge').textContent = state.level + 1;
  $('levelName').textContent = LEVELS[state.level].name;
  $('score').textContent = '⭐ ' + state.score;
  $('progressFill').style.width = (state.questionInRound / ROUND_SIZE * 100) + '%';
}

function nextProblem() {
  state.current = LEVELS[state.level].gen();
  state.locked = false;

  $('problemText').textContent =
    `${state.current.a} ${state.current.op} ${state.current.b}`;

  const opts = makeOptions(state.current.answer);
  const answersEl = $('answers');
  answersEl.innerHTML = '';
  opts.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = v;
    btn.dataset.value = v;
    btn.addEventListener('click', () => onAnswer(v, btn));
    answersEl.appendChild(btn);
  });

  render();
}

/* ============ Ответ ============ */
const CHEERS = ['Молодец! 🎉','Отлично!','Супер!','Верно!','Так держать!','Здорово!','Правильно!','Ты справилась! ⭐'];
const pickCheer = () => CHEERS[Math.floor(Math.random() * CHEERS.length)];

function showToast(text, warn = false) {
  const t = $('toast');
  t.textContent = text;
  t.className = 'toast show' + (warn ? ' warn' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 1100);
}

function onAnswer(value, btn) {
  if (state.locked) return;
  state.locked = true;
  ensureAudio();

  const isCorrect = (value === state.current.answer);
  const allBtns = document.querySelectorAll('.answer-btn');
  allBtns.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    sndCorrect();
    state.score += 10;
    state.correctInRound++;
    showToast(pickCheer());
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b => {
      if (parseInt(b.dataset.value, 10) === state.current.answer) {
        b.classList.add('correct');
      }
    });
    sndWrong();
    showToast('Правильный ответ: ' + state.current.answer, true);
  }

  state.questionInRound++;
  render();
  saveProgress();

  const delay = isCorrect ? 800 : 1500;
  setTimeout(() => {
    if (state.questionInRound >= ROUND_SIZE) endRound();
    else nextProblem();
  }, delay);
}

/* ============ Конец раунда ============ */
function endRound() {
  const score = state.correctInRound;
  const total = ROUND_SIZE;
  let grade, msg;
  if (score === total)      { grade = '5';  msg = 'Идеально! 🎉'; }
  else if (score === total - 1) { grade = '5−'; msg = 'Отлично!'; }
  else if (score === total - 2) { grade = '4+'; msg = 'Очень хорошо!'; }
  else if (score === total - 3) { grade = '4';  msg = 'Хорошо!'; }
  else if (score === total - 4) { grade = '3+'; msg = 'Неплохо!'; }
  else if (score >= 5)      { grade = '3';  msg = 'Потренируемся ещё'; }
  else                      { grade = '—';  msg = 'Попробуй ещё разок'; }

  const passed = score >= PASS;
  const hasNext = state.level + 1 < LEVELS.length;

  $('gradeEmoji').textContent = grade;
  $('gradeText').textContent  = msg;
  $('statsText').textContent  = `Правильно: ${score} из ${total}`;
  $('continueBtn').textContent =
    (passed && hasNext) ? 'Следующий уровень →' : 'Ещё раз';

  $('overlay').dataset.passed = passed ? '1' : '0';
  $('overlay').dataset.hasNext = hasNext ? '1' : '0';
  $('overlay').classList.add('show');
}

$('continueBtn').addEventListener('click', () => {
  const passed  = $('overlay').dataset.passed  === '1';
  const hasNext = $('overlay').dataset.hasNext === '1';
  $('overlay').classList.remove('show');

  if (passed && hasNext) state.level++;

  state.questionInRound = 0;
  state.correctInRound  = 0;
  saveProgress();
  setTimeout(nextProblem, 150);
});

/* ============ Старт ============ */
loadProgress();
nextProblem();
</script>
</body>
</html>
